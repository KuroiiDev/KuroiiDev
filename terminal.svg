<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="Terminal: Sam (KuroiiDev), Full Stack Developer, Computer Engineering at Diponegoro University">
  <defs>
    <clipPath id="c1"><rect x="24" y="52" width="0" height="28">
      <animate attributeName="width" from="0" to="315" begin="0.6s" dur="1.4s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="24" y="164" width="0" height="28">
      <animate attributeName="width" from="0" to="261" begin="3.4s" dur="1.2s" fill="freeze"/>
    </rect></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="758" height="288" rx="10" fill="#0d0b14" stroke="#3d2a6e" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="288" rx="10" fill="url(#glow)"/>
  <rect x="1" y="1" width="758" height="36" rx="10" fill="#1a1530"/>
  <rect x="1" y="20" width="758" height="17" fill="#1a1530"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="380" y="24" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8b6fbb">sam@kuroiidev: ~</text>

  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="15">
    <!-- command 1 (typed) -->
    <g clip-path="url(#c1)">
      <text x="24" y="72" textLength="315" lengthAdjust="spacingAndGlyphs" fill="#e9defa"><tspan fill="#a78bfa">~/KuroiiDev $</tspan> sudo whoami --verbose</text>
    </g>

    <!-- output 1 -->
    <text x="24" y="100" fill="#e9defa" opacity="0">Sam [KuroiiDev] · Full Stack Developer
      <set attributeName="opacity" to="1" begin="2.3s"/>
    </text>
    <text x="24" y="122" fill="#c8b8f0" opacity="0">Computer Engineering @ Diponegoro University
      <set attributeName="opacity" to="1" begin="2.5s"/>
    </text>
    <text x="24" y="144" fill="#c8b8f0" opacity="0">Focus: Laravel · REST APIs · Flutter · Network Security
      <set attributeName="opacity" to="1" begin="2.7s"/>
    </text>

    <!-- command 2 (typed) -->
    <g clip-path="url(#c2)">
      <text x="24" y="184" textLength="261" lengthAdjust="spacingAndGlyphs" fill="#e9defa"><tspan fill="#a78bfa">~/KuroiiDev $</tspan> mylife --status</text>
    </g>

    <!-- output 2 -->
    <text x="24" y="212" fill="#c8b8f0" opacity="0"><tspan fill="#4ade80">●</tspan> Engaging in college, building in public
      <set attributeName="opacity" to="1" begin="4.9s"/>
    </text>

    <!-- idle prompt + cursor -->
    <text x="24" y="252" fill="#a78bfa" opacity="0">~/KuroiiDev $
      <set attributeName="opacity" to="1" begin="5.3s"/>
    </text>
    <rect x="156" y="239" width="9" height="17" fill="#a78bfa" opacity="0">
      <set attributeName="opacity" to="1" begin="5.3s"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="5.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
